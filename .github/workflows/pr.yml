# Fast PR checks. Contents read-only. Actions pinned to reviewed commits.
# Roles: shared (pure/traces/assets/package) + linux backend (stack) +
# native smoke. No secrets are required for fork PRs.
name: pr

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shared:
    name: Shared checks (pure, traces, assets, package)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Dev dependencies
        run: pip install -r dev/requirements.lock
      - name: Shared role lane
        run: |
          RUN_ID="${{ github.run_id }}-${{ github.run_attempt }}"
          python3 dev/reliability.py run-lane --stage pr --role shared \
            --out "artifacts/reliability/${RUN_ID}/shared"
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-shared-failure
          path: artifacts/
          retention-days: 30

  linux-native:
    name: Linux backend + one native smoke
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Dev dependencies and tooling
        run: |
          pip install -r dev/requirements.lock
          sudo apt-get update
          sudo apt-get install -y zstd xvfb libfuse2 libegl1 libgl1 libxkbcommon-x11-0 libxkbcommon0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libxcb-randr0 libxcb-sync1 libxcb-xinput0 libx11-xcb1 libxext6 libxrender1 libdbus-1-3 libfontconfig1 libglib2.0-0 libxi6 libxtst6 libxdamage1 libxcomposite1 libxrandr2 libxcursor1 libsm6 libice6 libnss3 libasound2 libpulse0 libpulse-mainloop-glib0 libwayland-cursor0 libwayland-egl1 libgstreamer1.0-0 libgstreamer-plugins-base1.0-0
      - name: Docker + Supabase CLI
        run: |
          docker info
          npm install -g supabase@2.115.0
      - name: Install pinned Anki runtime
        run: |
          BIN=$(python3 dev/fetch_runtimes.py --download linux/26.8.1 \
            --qt 6 --arch x86_64 --dest .dev/runtimes --install | tail -n1)
          echo "ANKI_BIN=$BIN" >> "$GITHUB_ENV"
          echo "resolved runtime: $BIN"
      - name: Start the local stack
        working-directory: server
        run: supabase start
      - name: Backend role lane
        run: |
          RUN_ID="${{ github.run_id }}-${{ github.run_attempt }}"
          python3 dev/reliability.py run-lane --stage pr --role backend \
            --os linux --out "artifacts/reliability/${RUN_ID}/backend"
      - name: Native role lane (one packaged smoke)
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
          QTWEBENGINE_CHROMIUM_FLAGS: "--disable-gpu"
          QTWEBENGINE_DISABLE_SANDBOX: "1"
        run: |
          RUN_ID="${{ github.run_id }}-${{ github.run_attempt }}"
          xvfb-run -a python3 dev/reliability.py run-lane --stage pr \
            --role native --os linux --anki 26.8.1 --qt 6 \
            --anki-bin "${ANKI_BIN:-}" \
            --out "artifacts/reliability/${RUN_ID}/linux-pr"
      - name: Upload PR evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reliability-pr-linux
          path: artifacts/reliability/
          retention-days: 30

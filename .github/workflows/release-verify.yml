# Release verification: manual, pinned candidate SHA on trusted main. The
# candidate is built ONCE with production configuration; every role tests
# those immutable bytes (hash-verified) and the aggregate refuses to pass on
# missing/failed owners. No publish step. Actions pinned to reviewed commits.
name: release-verify

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full commit SHA of the release candidate (must be on main)
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Validate and build the immutable candidate
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    outputs:
      artifact_sha: ${{ steps.hash.outputs.artifact_sha }}
      config_sha: ${{ steps.hash.outputs.config_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Reject untrusted refs before secrets
        run: |
          CANDIDATE="${{ inputs.candidate_sha }}"
          case "$CANDIDATE" in
            *[!0-9a-f]*|"") echo "not a full commit sha: $CANDIDATE"; exit 1;;
          esac
          if [ "${#CANDIDATE}" != 40 ]; then
            echo "expected a full 40-char sha, got ${#CANDIDATE}"; exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$CANDIDATE" origin/main; then
            echo "candidate $CANDIDATE is not on trusted main"; exit 1
          fi
          git checkout "$CANDIDATE"
          git rev-parse HEAD
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install -r dev/requirements.lock
      - name: Production configuration (public anon key only)
        env:
          ANKISCAPE_PROD_URL: ${{ secrets.ANKISCAPE_PROD_URL }}
          ANKISCAPE_PROD_ANON_KEY: ${{ secrets.ANKISCAPE_PROD_ANON_KEY }}
        run: |
          python3 scripts/make_prod_config.py
          test -f evolved/prod_config.py
          python3 - <<'PY'
          import os, re
          text = open("evolved/prod_config.py", encoding="utf-8").read()
          url = re.search(r"SUPABASE_URL = '([^']+)'", text).group(1)
          expected = os.environ["ANKISCAPE_PROD_URL"].rstrip("/")
          assert url.rstrip("/") == expected, (url, expected)
          print("baked host:", url)
          PY
      - name: Full suite, package build and archive audit
        run: |
          python3 run_tests.py
          python3 scripts/build_addon.py
          python3 scripts/audit_assets.py --check
          python3 scripts/audit_assets.py --archive dist/ankiscape-3.0.0.ankiaddon
      - name: Assert the endpoint is baked
        run: |
          python3 - <<'PY'
          import json
          record = json.load(open("dist/manifest.json"))
          assert record.get("prod_endpoint_baked") is True, record
          print("prod_endpoint_baked:", record["prod_endpoint_baked"])
          PY
      - name: Record artifact and config hashes
        id: hash
        run: |
          HASH=$(python3 -c "import json;print(json.load(open('dist/manifest.json'))['artifact_sha256'])")
          CONFIG=$(sha256sum evolved/prod_config.py | cut -d' ' -f1)
          echo "artifact_sha=$HASH" >> "$GITHUB_OUTPUT"
          echo "config_sha=$CONFIG" >> "$GITHUB_OUTPUT"
      - name: Upload candidate artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-artifact
          path: |
            dist/ankiscape-3.0.0.ankiaddon
            dist/manifest.json
          retention-days: 90

  shared:
    name: Shared role (pure, traces, assets, engine benchmarks)
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install -r dev/requirements.lock
      - name: Download the candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate-artifact
          path: dist
      - name: Verify candidate bytes unchanged
        run: |
          ACTUAL=$(python3 -c "import json;print(json.load(open('dist/manifest.json'))['artifact_sha256'])")
          test "$ACTUAL" = "${{ needs.build.outputs.artifact_sha }}"
      - name: Shared role lane
        run: |
          RUN_ID="${{ github.run_id }}-${{ github.run_attempt }}"
          python3 dev/reliability.py run-lane --stage release --role shared \
            --out "artifacts/reliability/${RUN_ID}/shared"
      - name: Bundle and upload evidence
        if: always()
        run: |
          RUN_ID="${{ github.run_id }}-${{ github.run_attempt }}"
          tar -C artifacts/reliability -cf "artifacts/evidence-shared.tar" "${RUN_ID}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: evidence-shared
          path: artifacts/evidence-shared.tar
          if-no-files-found: warn
          retention-days: 90

  backend:
    name: Linux backend role (stack, sync, full mutation)
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install -r dev/requirements.lock
      - name: Linux packages, Docker and Supabase CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd xvfb libfuse2 libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libdbus-1-3 libfontconfig1
          docker info
          npm install -g supabase@2.115.0
      - name: Download the candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate-artifact
          path: dist
      - name: Verify candidate bytes unchanged
        run: |
          ACTUAL=$(python3 -c "import json;print(json.load(open('dist/manifest.json'))['artifact_sha256'])")
          test "$ACTUAL" = "${{ needs.build.outputs.artifact_sha }}"
      - name: Install pinned Anki runtime
        run: |
          BIN=$(python3 dev/fetch_runtimes.py --download linux/26.8.1 \
            --qt 6 --arch x86_64 --dest .dev/runtimes --install | tail -n1)
          echo "ANKI_BIN=$BIN" >> "$GITHUB_ENV"
      - name: Start the local stack
        working-directory: server
        run: supabase start
      - name: Backend role lane (includes full mutation gate)
        run: |
          RUN_ID="${{ github.run_id }}-${{ github.run_attempt }}"
          python3 dev/reliability.py run-lane --stage release --role backend \
            --os linux --out "artifacts/reliability/${RUN_ID}/backend"
      - name: Bundle and upload evidence
        if: always()
        run: |
          RUN_ID="${{ github.run_id }}-${{ github.run_attempt }}"
          tar -C artifacts/reliability -cf "artifacts/evidence-backend.tar" "${RUN_ID}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: evidence-backend
          path: artifacts/evidence-backend.tar
          if-no-files-found: warn
          retention-days: 90

  lanes:
    name: ${{ matrix.label }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: "macos-23.10-qt6", os: macos, runner: macos-14, anki: "23.10", qt: "6", arch: arm64 }
          - { label: "macos-26.8.1-qt6", os: macos, runner: macos-14, anki: "26.8.1", qt: "6", arch: arm64 }
          - { label: "windows-23.10-qt6", os: windows, runner: windows-2022, anki: "23.10", qt: "6", arch: x64 }
          - { label: "windows-26.8.1-qt6", os: windows, runner: windows-2022, anki: "26.8.1", qt: "6", arch: x64 }
          - { label: "linux-23.10-qt5", os: linux, runner: ubuntu-22.04, anki: "23.10", qt: "5", arch: x86_64 }
          - { label: "linux-23.10-qt6", os: linux, runner: ubuntu-22.04, anki: "23.10", qt: "6", arch: x86_64 }
          - { label: "linux-26.8.1-qt6", os: linux, runner: ubuntu-22.04, anki: "26.8.1", qt: "6", arch: x86_64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install -r dev/requirements.lock
      - name: Linux system packages
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd xvfb libfuse2 libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libdbus-1-3 libfontconfig1
      - name: Download the candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate-artifact
          path: dist
      - name: Verify candidate bytes unchanged
        shell: bash
        run: |
          ACTUAL=$(python3 -c "import json;print(json.load(open('dist/manifest.json'))['artifact_sha256'])")
          test "$ACTUAL" = "${{ needs.build.outputs.artifact_sha }}"
      - name: Install pinned runtime
        shell: bash
        run: |
          BIN=$(python3 dev/fetch_runtimes.py --download ${{ matrix.os }}/${{ matrix.anki }} \
            --qt ${{ matrix.qt }} --arch ${{ matrix.arch }} --dest .dev/runtimes --install | tail -n1)
          echo "ANKI_BIN=$BIN" >> "$GITHUB_ENV"
          echo "resolved runtime: $BIN"
      - name: Native role lane (journeys, performance, two-hour endurance)
        shell: bash
        env:
          ANKISCAPE_FIXTURE_EMAIL: ${{ secrets.ANKISCAPE_FIXTURE_EMAIL }}
          ANKISCAPE_FIXTURE_PASSWORD: ${{ secrets.ANKISCAPE_FIXTURE_PASSWORD }}
        run: |
          RUN_ID="${{ github.run_id }}-${{ github.run_attempt }}"
          if [ "${{ matrix.os }}" = "linux" ]; then
            xvfb-run -a python3 dev/reliability.py run-lane --stage release \
              --role native --os "${{ matrix.os }}" --anki "${{ matrix.anki }}" \
              --qt "${{ matrix.qt }}" --anki-bin "${ANKI_BIN:-}" \
              --out "artifacts/reliability/${RUN_ID}/${{ matrix.label }}"
          else
            python3 dev/reliability.py run-lane --stage release \
              --role native --os "${{ matrix.os }}" --anki "${{ matrix.anki }}" \
              --qt "${{ matrix.qt }}" --anki-bin "${ANKI_BIN:-}" \
              --out "artifacts/reliability/${RUN_ID}/${{ matrix.label }}"
          fi
      - name: Bundle and upload evidence
        if: always()
        shell: bash
        run: |
          RUN_ID="${{ github.run_id }}-${{ github.run_attempt }}"
          tar -C artifacts/reliability -cf "artifacts/evidence-${{ matrix.label }}.tar" "${RUN_ID}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: evidence-${{ matrix.label }}
          path: artifacts/evidence-${{ matrix.label }}.tar
          if-no-files-found: warn
          retention-days: 90

  hosted:
    name: Trusted hosted backend role
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    environment: hosted-fixtures
    concurrency:
      group: hosted-fixtures
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install -r dev/requirements.lock
      - name: Hosted role lane
        env:
          ANKISCAPE_PROD_URL: ${{ secrets.ANKISCAPE_PROD_URL }}
          ANKISCAPE_PROD_ANON_KEY: ${{ secrets.ANKISCAPE_PROD_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANKISCAPE_FIXTURE_SECRET: ${{ secrets.ANKISCAPE_FIXTURE_SECRET }}
        run: |
          RUN_ID="${{ github.run_id }}-${{ github.run_attempt }}"
          python3 dev/reliability.py run-lane --stage release --role hosted \
            --trusted --out "artifacts/reliability/${RUN_ID}/hosted"
      - name: Bundle and upload evidence
        if: always()
        run: |
          RUN_ID="${{ github.run_id }}-${{ github.run_attempt }}"
          tar -C artifacts/reliability -cf "artifacts/evidence-hosted.tar" "${RUN_ID}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: evidence-hosted
          path: artifacts/evidence-hosted.tar
          if-no-files-found: warn
          retention-days: 90

  aggregate:
    name: Aggregate and validate release evidence
    needs: [build, shared, backend, lanes, hosted]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install -r dev/requirements.lock
      - name: Download candidate and evidence bundles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: "*"
          merge-multiple: true
          path: merged
      - name: Extract evidence tars
        run: |
          mkdir -p dist artifacts/reliability
          cp merged/ankiscape-3.0.0.ankiaddon dist/
          cp merged/manifest.json dist/
          for bundle in merged/evidence-*.tar; do
            [ -f "$bundle" ] || continue
            tar -xf "$bundle" -C artifacts/reliability
          done
          find artifacts/reliability -name record.json | sort
      - name: Any required job failed?
        if: needs.build.result != 'success' || needs.shared.result != 'success' || needs.backend.result != 'success' || needs.lanes.result != 'success' || needs.hosted.result != 'success'
        run: |
          echo "required job failed: build=${{ needs.build.result }} shared=${{ needs.shared.result }} backend=${{ needs.backend.result }} lanes=${{ needs.lanes.result }} hosted=${{ needs.hosted.result }}"
          exit 1
      - name: Strict release evidence validation
        run: |
          python3 dev/reliability.py verify-evidence --stage release \
            --matrix dev/reliability-matrix.json \
            --evidence artifacts/reliability \
            --expected-commit "${{ inputs.candidate_sha }}" \
            --expected-artifact-sha256 "${{ needs.build.outputs.artifact_sha }}" \
            --expected-run-id "${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Upload aggregated evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence-aggregate
          path: artifacts/reliability/
          retention-days: 90

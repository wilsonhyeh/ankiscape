name: Feature request
description: Suggest an improvement for AnkiScape
title: "[Feature] "
labels: ["needs-info"]
body:
  - type: markdown
    attributes:
      value: |
        AnkiScape is an independent, noncommercial passion project. Please
        describe the study problem first, then the idea.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe your study workflow and where it hurts.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed improvement
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

# Supabase local stack (AnkiScape Evolved 3.0). Root orchestration starts
# Supabase with working directory server/; local-only Auth + email capture.
[api]
enabled = true
port = 55321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
major_version = 15

[studio]
enabled = true
port = 55323

[auth]
enabled = true
site_url = "http://127.0.0.1:54321"
enable_signup = true
# Password policy enforced consistently at signup/reset (configured Supabase
# policy; bounded input, paste/manager support, generic errors in add-on).
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

# Managed OTP codes entered in the add-on (no reset website). Same templates
# ship to production with the custom Resend SMTP sender.
[auth.email.template.confirmation]
subject = "Your AnkiScape code: {{ .Token }}"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Your AnkiScape code: {{ .Token }}"
content_path = "./supabase/templates/recovery.html"

# Local-only email capture for tests. Production uses custom Resend SMTP with
# ankiscape@ankiscape.xyz (fresh domain verification, Wilson-operated).
# Never commit live credentials here.
[inbucket]
enabled = true
port = 55324

[storage]
enabled = true
